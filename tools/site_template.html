<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho Dữ Liệu NRO</title>
<meta name="description" content="Tra cứu vật phẩm, kỹ năng, quái, NPC và bản đồ NRO theo tên hoặc id. Gõ không dấu vẫn ra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eaecf2; --surface:#ffffff; --surface-2:#f4f5f9;
  --line:#d5d9e3; --line-soft:#e4e7ee;
  --ink:#161922; --ink-2:#4c5366; --ink-3:#7b8397;
  --brass:#96671a; --brass-bg:#f6e9cf;
  --jade:#1c6f5a; --jade-bg:#d9ebe4;
  --focus:#3856c9;
  --radius:10px;
  --shadow:0 1px 2px rgba(22,25,34,.06), 0 8px 24px rgba(22,25,34,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0e1117; --surface:#161a22; --surface-2:#1d222c;
    --line:#2a303c; --line-soft:#232935;
    --ink:#e8ebf2; --ink-2:#a5adbf; --ink-3:#7a8296;
    --brass:#d8a548; --brass-bg:#3a2f18;
    --jade:#6bc0a5; --jade-bg:#16332b;
    --focus:#7d94f0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1117; --surface:#161a22; --surface-2:#1d222c;
  --line:#2a303c; --line-soft:#232935;
  --ink:#e8ebf2; --ink-2:#a5adbf; --ink-3:#7a8296;
  --brass:#d8a548; --brass-bg:#3a2f18;
  --jade:#6bc0a5; --jade-bg:#16332b;
  --focus:#7d94f0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums}

header{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.bar{max-width:1400px; margin:0 auto; padding:13px 20px; display:flex; flex-direction:column; gap:11px}
.brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
h1{margin:0; font-size:19px; font-weight:800; letter-spacing:-.02em}
.brand .sub{color:var(--ink-3); font-size:12.5px}

/* ---------- tab bang du lieu ---------- */
.tabs{display:flex; gap:3px; flex-wrap:wrap; border-bottom:1px solid var(--line-soft); margin:0 -2px}
.tab{
  padding:8px 13px 9px; font:inherit; font-size:13.5px; font-weight:500;
  background:none; color:var(--ink-3); border:none; border-bottom:2px solid transparent;
  cursor:pointer; display:flex; align-items:baseline; gap:6px;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--brass); font-weight:600}
.tab .n{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}

.controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.search{position:relative; flex:1 1 280px; min-width:200px}
.search input{
  width:100%; padding:9px 34px 9px 12px; font:inherit;
  background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line); border-radius:var(--radius);
}
.search input::placeholder{color:var(--ink-3)}
.search kbd{
  position:absolute; right:9px; top:50%; transform:translateY(-50%);
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  border:1px solid var(--line); border-radius:5px; padding:1px 5px;
  pointer-events:none; background:var(--surface);
}
select{
  padding:9px 10px; font:inherit; max-width:230px;
  background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line); border-radius:var(--radius);
}
select[hidden]{display:none}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  padding:6px 11px; font:inherit; font-size:12.5px; font-weight:500;
  background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.chip:hover{border-color:var(--ink-3)}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.count{color:var(--ink-3); font-size:12.5px; margin-left:auto; white-space:nowrap}
.count b{color:var(--ink); font-weight:600}

main{max-width:1400px; margin:0 auto; padding:18px 20px 60px}
.grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

.card{
  display:grid; grid-template-columns:44px 1fr; gap:11px; align-items:center;
  padding:10px 11px; text-align:left; font:inherit; width:100%;
  background:var(--surface); color:inherit;
  border:1px solid var(--line-soft); border-radius:var(--radius); cursor:pointer;
}
.card:hover{border-color:var(--brass); box-shadow:var(--shadow)}
.card[aria-selected="true"]{border-color:var(--brass); background:var(--brass-bg)}
.card:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.card .nm{font-weight:500; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .meta{display:flex; gap:7px; align-items:center; margin-top:3px; font-size:11.5px; color:var(--ink-3)}

.thumb{width:44px; height:44px; display:grid; place-items:center; background:var(--surface-2); border-radius:8px; overflow:hidden}
.thumb.empty{color:var(--ink-3); font-size:10px; font-family:"IBM Plex Mono",monospace}
.thumb.sm{width:28px; height:28px; border-radius:6px}
.thumb.sm.empty{font-size:9px}
.sp{display:block; background-image:url("assets/icons.png?v=__BUILD__"); background-repeat:no-repeat; image-rendering:pixelated}
/* sprite quai nam trong mot atlas rieng */
.msp{display:block; background-image:url("assets/mobs.png?v=__BUILD__"); background-repeat:no-repeat; image-rendering:pixelated}

.id{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600; color:var(--brass)}

/* ---------- bang ---------- */
.tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:8px 12px; text-align:left; white-space:nowrap}
th{
  position:sticky; top:0; background:var(--surface-2); color:var(--ink-3);
  font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
  border-bottom:1px solid var(--line);
}
td{border-bottom:1px solid var(--line-soft)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr[aria-selected="true"] td{background:var(--brass-bg)}
.n{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}

.empty-state{padding:60px 20px; text-align:center; color:var(--ink-3)}

.pager{display:flex; gap:5px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:22px}
.pager:empty{display:none}
.pager button{
  min-width:36px; padding:7px 10px; font-size:13px;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  background:var(--surface); color:var(--ink-2);
  border:1px solid var(--line); border-radius:8px; cursor:pointer;
}
.pager button:hover:not(:disabled){border-color:var(--brass); color:var(--ink)}
.pager button[aria-current="page"]{background:var(--ink); color:var(--surface); border-color:var(--ink); font-weight:600}
.pager button:disabled{opacity:.35; cursor:default}
.pager .step{font-family:"Be Vietnam Pro",sans-serif; font-weight:500}
.pager .gap{color:var(--ink-3); padding:0 3px; user-select:none}
.pager .total{margin-left:8px; color:var(--ink-3); font-size:12.5px; font-family:"Be Vietnam Pro",sans-serif}

.detail{
  position:fixed; right:0; top:0; bottom:0; width:min(420px,100%);
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow);
  transform:translateX(100%); transition:transform .18s ease;
  z-index:30; overflow-y:auto; padding:18px 20px 30px;
}
.detail[data-open="true"]{transform:translateX(0)}
@media (prefers-reduced-motion: reduce){ .detail{transition:none} }
.detail .top{display:flex; gap:14px; align-items:flex-start; margin-bottom:16px}
.detail .top .thumb{width:64px; height:64px; flex:none}
.detail h2{margin:0 0 4px; font-size:16px; font-weight:600; line-height:1.3}
.detail h3{margin:20px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:600}
.detail .desc{color:var(--ink-2); font-size:13px; margin:10px 0 0}
.detail table{font-size:12px}
.detail th,.detail td{padding:5px 8px}
.close{
  position:absolute; right:12px; top:12px; font:inherit;
  background:none; border:1px solid var(--line); border-radius:8px;
  color:var(--ink-2); cursor:pointer; padding:3px 9px;
}
dl{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; margin:16px 0 0; font-size:13px}
dt{color:var(--ink-3)}
dd{margin:0; text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
dd.gold{color:var(--brass)}
dd.gem{color:var(--jade)}
dd.wrap{text-align:left; font-family:inherit; white-space:normal}
/* ---------- preview hoat anh nhan vat ---------- */
.charwrap{
  display:flex; gap:16px; align-items:center; margin-top:10px; padding:14px;
  background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius);
}
.charbox{
  width:160px; height:180px; flex:none; overflow:hidden; border-radius:8px;
  display:grid; place-items:center;
  background:repeating-conic-gradient(var(--line-soft) 0% 25%, transparent 0% 50%) 50%/14px 14px;
}
/* kich thuoc va ti le do JS dat, tuy hop bao that cua sprite */
.charstage{position:relative}
.charctl{display:flex; flex-direction:column; gap:9px; min-width:0; flex:1}
.charctl button{
  padding:7px 12px; font:inherit; font-size:13px; font-weight:500;
  background:var(--surface); color:var(--ink-2);
  border:1px solid var(--line); border-radius:8px; cursor:pointer;
}
.charctl button:hover{border-color:var(--brass); color:var(--ink)}
.charctl input[type="range"]{width:100%; accent-color:var(--brass)}
.charctl .lbl{font-size:11.5px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}

.taglist{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.tag{
  font-size:11.5px; padding:3px 8px; border-radius:6px;
  background:var(--surface-2); border:1px solid var(--line-soft); color:var(--ink-2);
}
.tag b{color:var(--brass); font-family:"IBM Plex Mono",monospace; font-weight:600}
.was{color:var(--ink-3); font-size:10.5px; font-weight:400}
.copy{
  margin-top:18px; width:100%; padding:10px; font:inherit; font-weight:600;
  background:var(--ink); color:var(--surface); border:none; border-radius:var(--radius); cursor:pointer;
}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px);
  background:var(--ink); color:var(--surface);
  padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500;
  opacity:0; pointer-events:none; transition:opacity .16s, transform .16s; z-index:40;
}
.toast[data-show="true"]{opacity:1; transform:translate(-50%,0)}
footer{max-width:1400px; margin:0 auto; padding:0 20px 40px; color:var(--ink-3); font-size:12px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <h1>Kho Dữ Liệu NRO</h1>
      <span class="sub">vật phẩm · loại đồ · kỹ năng · mốc sức mạnh · quái · NPC · bản đồ · nhiệm vụ</span>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>

    <div class="controls">
      <div class="search">
        <input id="q" type="search" placeholder="Tìm theo tên hoặc id — gõ không dấu cũng ra" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <select id="filter" aria-label="Lọc"></select>
      <select id="sort" aria-label="Sắp xếp"></select>
      <select id="perpage" aria-label="Số dòng mỗi trang">
        <option value="60">60 / trang</option>
        <option value="120">120 / trang</option>
        <option value="240">240 / trang</option>
      </select>
      <div class="chips" id="chips"></div>
      <span class="count" id="count">đang tải…</span>
    </div>
  </div>
</header>

<main>
  <div id="body"></div>
  <div class="empty-state" id="empty" hidden>Không có dòng nào khớp.</div>
  <nav class="pager" id="pager" aria-label="Phân trang"></nav>
</main>

<footer>
  Bấm một dòng để chép id. Phím <span class="mono">/</span> vào ô tìm kiếm,
  <span class="mono">←</span> <span class="mono">→</span> lật trang, <span class="mono">Esc</span> đóng bảng chi tiết.
</footer>

<aside class="detail" id="detail" data-open="false" aria-live="polite">
  <button class="close" id="close" aria-label="Đóng">Đóng</button>
  <div id="detail-body"></div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";

  const el = {
    tabs: document.getElementById("tabs"),
    q: document.getElementById("q"),
    filter: document.getElementById("filter"),
    sort: document.getElementById("sort"),
    perpage: document.getElementById("perpage"),
    chips: document.getElementById("chips"),
    body: document.getElementById("body"),
    count: document.getElementById("count"),
    empty: document.getElementById("empty"),
    pager: document.getElementById("pager"),
    detail: document.getElementById("detail"),
    detailBody: document.getElementById("detail-body"),
    toast: document.getElementById("toast"),
  };

  let D = null, COORDS = {};
  let view = "items", filtered = [], selected = null, page = 1;
  let perPage = Number(el.perpage.value) || 60;
  const chipState = new Set();

  const COMBINING = new RegExp("[̀-ͯ]", "g");
  const fold = s => (s || "").normalize("NFD").replace(COMBINING, "")
                      .replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const num = n => (n || 0).toLocaleString("vi-VN");

  // ---------- icon tu atlas ----------
  function icon(id, box, cls){
    const klass = "thumb" + (cls ? " " + cls : "");
    const c = COORDS[id];
    if (!c) return `<div class="${klass} empty">${id < 0 ? "—" : esc(id)}</div>`;
    const [x, y, w, h] = c;
    const s = Math.min(1, box / Math.max(w, h));
    return `<div class="${klass}"><i class="sp" style="width:${w}px;height:${h}px;` +
           `background-position:${-x}px ${-y}px;transform:scale(${s.toFixed(3)})"></i></div>`;
  }

  const rowTag = (label, value, cls) => `<dt>${esc(label)}</dt><dd class="${cls || ""}">${value}</dd>`;
  const byName = (a, b) => a.name.localeCompare(b.name, "vi");
  const byId = (a, b) => a.id - b.id;
  const desc = key => (a, b) => (b[key] || 0) - (a[key] || 0) || a.id - b.id;

  // tra nguoc id -> ban ghi, dung cho phan chi tiet ban do
  let mobName = {}, npcName = {}, mapName = {}, npcById = {}, mobById = {};

  // ---------- dinh nghia tung bang ----------
  const VIEWS = {
    items: {
      label: "Vật phẩm",
      rows: () => D.items,
      text: r => fold(r.name) + " " + fold(r.desc) + " " + r.id,
      filter: () => ({ label: "Tất cả loại", key: "type",
                       options: D.itemTypes.map(t => ({ v: t.v, label: `${t.label} · loại ${t.v} (${t.n})` })) }),
      chips: () => D.genders.map(g => ({ v: g.v, label: g.label, key: "gender" })),
      sorts: [{ v: "id", label: "Sắp theo id", cmp: byId },
              { v: "name", label: "Sắp theo tên", cmp: byName },
              { v: "level", label: "Sắp theo cấp", cmp: desc("level") },
              { v: "power", label: "Sắp theo sức mạnh", cmp: desc("power") },
              { v: "gold", label: "Sắp theo giá vàng", cmp: desc("gold") }],
      mode: "cards",
      card: r => cardHtml(r, icon(r.icon, 40), labelOf(D.itemTypes, r.type)),
      detail: r => `
        <div class="top">${icon(r.icon, 58)}<div><h2>${esc(r.name)}</h2><span class="id">#${r.id}</span></div></div>
        ${r.desc ? `<p class="desc">${esc(r.desc)}</p>` : ""}
        <dl>
          ${rowTag("Loại", `${esc(labelOf(D.itemTypes, r.type))} · ${r.type}`)}
          ${rowTag("Phái", esc(labelOf(D.genders, r.gender)))}
          ${rowTag("Cấp", num(r.level))}
          ${rowTag("Sức mạnh yêu cầu", num(r.power))}
          ${rowTag("Giá vàng", num(r.gold), "gold")}
          ${rowTag("Giá ngọc", num(r.gem), "gem")}
          ${rowTag("icon_id", r.icon)}
          ${rowTag("part", r.part)}
          ${rowTag("head / body / leg", `${r.head} / ${r.body} / ${r.leg}`)}
          ${rowTag("Nâng cấp được", r.upup ? "có" : "không")}
        </dl>`,
    },

    skills: {
      label: "Kỹ năng",
      rows: () => D.skills,
      text: r => fold(r.name) + " " + fold(r.damInfo) + " " + r.id,
      filter: () => ({ label: "Tất cả lớp", key: "nclass",
                       options: D.classes.map(c => ({ v: c.v, label: `Lớp ${c.v} (${c.n})` })) }),
      sorts: [{ v: "id", label: "Sắp theo id", cmp: byId },
              { v: "name", label: "Sắp theo tên", cmp: byName },
              { v: "maxPoint", label: "Sắp theo điểm tối đa", cmp: desc("maxPoint") }],
      mode: "cards",
      card: r => cardHtml(r, icon(r.icon, 40), `${r.levels.length} cấp · lớp ${r.nclass}`),
      detail: r => `
        <div class="top">${icon(r.icon, 58)}<div><h2>${esc(r.name)}</h2><span class="id">#${r.id}</span></div></div>
        ${r.damInfo ? `<p class="desc">${esc(r.damInfo)}</p>` : ""}
        <dl>
          ${rowTag("Lớp nhân vật", r.nclass)}
          ${rowTag("Điểm tối đa", r.maxPoint)}
          ${rowTag("Kiểu", r.type)}
          ${rowTag("Kiểu dùng mana", r.manaType)}
          ${rowTag("Ô kỹ năng", r.slot)}
          ${rowTag("icon_id", r.icon)}
        </dl>
        <h3>${r.levels.length} cấp</h3>
        <div class="tablewrap"><table>
          <thead><tr><th>Cấp</th><th class="n">Sát thương</th><th class="n">Mana</th><th class="n">Hồi</th><th class="n">Sức mạnh</th></tr></thead>
          <tbody>${r.levels.map(lv => `<tr>
            <td class="mono">${lv.point}</td>
            <td class="n">${num(lv.damage)}</td>
            <td class="n">${num(lv.mana)}</td>
            <td class="n">${(lv.cd / 1000).toFixed(1)}s</td>
            <td class="n">${num(lv.power)}</td>
          </tr>`).join("")}</tbody>
        </table></div>`,
    },

    mobs: {
      label: "Quái",
      rows: () => D.mobs,
      text: r => fold(r.name) + " " + r.id,
      filter: () => ({ label: "Tất cả loại", key: "type",
                       options: D.mobTypes.map(t => ({ v: t.v, label: `${t.label} · loại ${t.v} (${t.n})` })) }),
      sorts: [{ v: "id", label: "Sắp theo id", cmp: byId },
              { v: "name", label: "Sắp theo tên", cmp: byName },
              { v: "hp", label: "Sắp theo HP", cmp: desc("hp") },
              { v: "speed", label: "Sắp theo tốc độ", cmp: desc("speed") }],
      mode: "table",
      cols: [
        { label: "id", get: r => `<span class="id">${r.id}</span>` },
        { label: "Tên", get: r => esc(r.name) },
        { label: "Loại", get: r => r.type, n: true },
        { label: "HP", get: r => num(r.hp), n: true },
        { label: "Tốc độ", get: r => r.speed, n: true },
        { label: "Tầm đi", get: r => r.rangeMove, n: true },
        { label: "Phi tiêu", get: r => r.dart, n: true },
        { label: "% dame", get: r => r.pctDame, n: true },
        { label: "% tiềm năng", get: r => r.pctTiemNang, n: true },
      ],
      detail: r => `
        <div class="top"><div><h2>${esc(r.name)}</h2><span class="id">#${r.id}</span></div></div>
        ${mobPreview(r)}
        <dl>
          ${rowTag("Loại", `${esc(labelOf(D.mobTypes, r.type))} · ${r.type}`)}

    npcs: {

      sorts: [{ v: "id", label: "Sắp theo id", cmp: byId },

          <div class="taglist">${mapsWithNpc(r.id).slice(0, 40).map(m =>
            `<span class="tag">${esc(m.name)} <b>${m.id}</b></span>`).join("")}</div>` : ""}`,

    types: {

              { v: "n", label: "Sắp theo số vật phẩm", cmp: desc("n") }],
      mode: "table",
      cols: [
        { label: "loại", get: r => `<span class="id">${r.v}</span>` },
        { label: "Nhãn", get: r => esc(r.label) +

        { label: "Số vật phẩm", get: r => r.n, n: true },

        <p class="desc">${r.fromCode

    tasks: {

      detail: r => `
        <div class="top"><div><h2>${esc(r.name)}</h2><span class="id">#${r.id}</span></div></div>
        ${r.detail ? `<p class="desc">${esc(r.detail).replace(/\n/g, "<br>")}</p>` : ""}
        <h3>${r.subs.length} bước</h3>
        <div class="tablewrap"><table>
          <thead><tr><th class="n">#</th><th>Bước</th><th class="n">Số lượng</th><th>NPC</th><th>Bản đồ</th></tr></thead>
          <tbody>${r.subs.map((s, i) => `<tr>
            <td class="n">${i + 1}</td>

        </table></div>
        ${placeholderNote(r.detail + " " + r.subs.map(s => s.name + " " + s.notify).join(" "))}`,

    powers: {
      label: "Mốc sức mạnh",
      rows: () => D.powers,
      text: r => String(r.power) + " " + fold(r.name),
      sorts: [{ v: "id", label: "Sắp theo mốc tăng dần", cmp: byId },
              { v: "nItems", label: "Sắp theo số vật phẩm", cmp: desc("nItems") },
              { v: "nSkills", label: "Sắp theo số kỹ năng", cmp: desc("nSkills") }],
      mode: "table",
      cols: [
        { label: "Mốc sức mạnh", get: r => `<span class="id">${num(r.power)}</span>`, n: true },
        { label: "Vật phẩm mở khoá", get: r => r.nItems || "—", n: true },
        { label: "Kỹ năng mở khoá", get: r => r.nSkills || "—", n: true },
        { label: "Gồm", get: r => esc([...r.items.slice(0, 2).map(i => i.name),
                                       ...r.skills.slice(0, 2).map(s => s.name + " " + s.point)].join(" · ")) },
      ],
      detail: r => `
        <div class="top"><div><h2>${num(r.power)} sức mạnh</h2>
          <span class="id">${r.nItems} đồ · ${r.nSkills} kỹ năng</span></div></div>
        ${r.items.length ? `<h3>Vật phẩm mở khoá (${r.items.length})</h3>
          <div class="tablewrap"><table>

            <tbody>${r.items.map(i => `<tr>
              <td>${icon(i.icon, 24, "sm")}</td>
              <td><span class="id">${i.id}</span></td>
              <td>${esc(i.name)}</td>
            </tr>`).join("")}</tbody>
          </table></div>` : ""}
        ${r.skills.length ? `<h3>Kỹ năng mở khoá (${r.skills.length})</h3>
          <div class="tablewrap"><table>
            <thead><tr><th></th><th>id</th><th>Tên</th><th class="n">Cấp</th></tr></thead>
            <tbody>${r.skills.map(s => `<tr>
              <td>${icon(s.icon, 24, "sm")}</td>
              <td><span class="id">${s.id}</span></td>
              <td>${esc(s.name)}</td>
              <td class="n">${s.point}</td>
            </tr>`).join("")}</tbody>
          </table></div>` : ""}`,
    },

    maps: {
      label: "Bản đồ",
      rows: () => D.maps,
      text: r => fold(r.name) + " " + r.id,
      filter: () => ({ label: "Tất cả hành tinh", key: "planet",
                       options: D.planets.map(p => ({ v: p.v, label: `${p.label} (${p.n})` })) }),
      sorts: [{ v: "id", label: "Sắp theo id", cmp: byId },
              { v: "name", label: "Sắp theo tên", cmp: byName },
              { v: "zones", label: "Sắp theo số khu", cmp: desc("zones") }],
      mode: "table",
      cols: [
        { label: "id", get: r => `<span class="id">${r.id}</span>` },
        { label: "Tên", get: r => esc(r.name) },
        { label: "Hành tinh", get: r => esc(labelOf(D.planets, r.planet)) },
        { label: "Khu", get: r => r.zones, n: true },
        { label: "Tối đa", get: r => r.maxPlayer, n: true },
        { label: "Quái", get: r => r.mobs.length, n: true },
        { label: "NPC", get: r => r.npcs.length, n: true },
        { label: "Cửa", get: r => r.waypoints.length, n: true },
        { label: "tile", get: r => r.tile, n: true },
      ],
      detail: r => `
        <div class="top"><div><h2>${esc(r.name)}</h2><span class="id">#${r.id}</span></div></div>
        <dl>
          ${rowTag("Hành tinh", esc(labelOf(D.planets, r.planet)))}
          ${rowTag("Số khu", r.zones)}
          ${rowTag("Tối đa người", r.maxPlayer)}
          ${rowTag("Kiểu map", r.type)}
          ${rowTag("tile / bg", `${r.tile} / ${r.bg}`)}
          ${rowTag("Map đôi", r.double ? "có" : "không")}
        </dl>
        ${r.mobs.length ? mobTable(r.mobs) : ""}
        ${r.npcs.length ? npcTable([...new Set(r.npcs)]) : ""}
        ${r.waypoints.length ? `<h3>Cửa đi</h3>
          <div class="taglist">${r.waypoints.map(w =>
            `<span class="tag">${esc(w.name || mapName[w.to] || "?")}${w.to >= 0 ? ` <b>${w.to}</b>` : ""}</span>`).join("")}</div>` : ""}`,
    },
  };

  /** Dia diem cua mot buoc nhiem vu: id am la dia diem tuong trung, duong la id that. */
  function place(id, symbols, names){
    if (id === -1) return `<span class="was">—</span>`;
    if (id < 0) return `${esc(symbols[String(id)] || ("id " + id))} <span class="was">tương trưng</span>`;
    return `${esc(names[id] || "?")} <span class="was">${id}</span>`;
  }

  /** Liet ke y nghia cac %N xuat hien trong doan van ban nhiem vu. */
  function placeholderNote(text){
    const found = [...new Set((text || "").match(/%\d+/g) || [])]
      .sort((a, b) => Number(a.slice(1)) - Number(b.slice(1)));
    if (!found.length) return "";
    return `<h3>Chỗ thế tên</h3><div class="taglist">${found.map(p =>
      `<span class="tag"><b>${p}</b> ${esc(D.placeholders[p.slice(1)] || "?")}</span>`).join("")}</div>`;
  }

  function labelOf(list, v){
    const hit = (list || []).find(x => x.v === v);
    return hit ? hit.label : String(v);
  }

  function cardHtml(r, iconHtml, metaText){
    return `<button class="card" type="button" data-id="${r.id}" aria-selected="${selected === r.id}">
      ${iconHtml}
      <span>
        <span class="nm">${esc(r.name)}</span>
        <span class="meta"><span class="id">#${r.id}</span><span>${esc(metaText)}</span></span>
      </span>
    </button>`;
  }

  const mapsContaining = mobId => D.maps.filter(m => m.mobs.some(x => x.t === mobId));
  const mapsWithNpc = npcId => D.maps.filter(m => m.npcs.includes(npcId));

  // ---------- preview hoat anh nhan vat ----------
  // Ghep ba manh dau / chan / than theo bang Char.CharInfo trich tu client:
  // moi khung hinh cho biet lay khung thu may cua tung manh va dat lech bao nhieu.
  // Khong co bang nay thi ba manh khong the xep dung cho.

  const PART_SLOT = [
    { k: 0, key: "head" },   // thu tu ve giong client: dau, roi chan, roi than
    { k: 1, key: "leg" },
    { k: 2, key: "body" },
  ];

  function partOf(npc, key){
    const id = npc[key];
    return id >= 0 ? D.parts[id] : null;
  }

  function partFrameNote(npc){
    return PART_SLOT.map(s => {
      const p = partOf(npc, s.key);
      return `${s.key} ${p ? p.frames.length : 0}`;
    }).join(" · ");
  }

  function hasChar(npc){
    return D.charInfo && D.charInfo.length && PART_SLOT.some(s => partOf(npc, s.key));
  }

  /** Cac khung hinh ma NPC nay thuc su co anh cho MOI manh.
   *
   * Phan lon NPC chi dinh nghia dung mot tu the dung yen: bang part cua ho co
   * 3/14/17 o nhung chi mot o tro toi anh that, con lai tro toi anh id 0 (2x2 rong).
   * Chay het 33 khung se ra 32 khung trong, nen chi chay qua khung dung duoc.
   */
  function usableFrames(npc){
    const out = [];
    D.charInfo.forEach((info, cf) => {
      let ok = true, any = false;
      for (const slot of PART_SLOT){
        const part = partOf(npc, slot.key);
        if (!part) continue;
        const fr = part.frames[info[slot.k][0]];
        if (!fr || fr[0] <= 0) { ok = false; break; }
        any = true;
      }
      if (ok && any) out.push(cf);
    });
    return out;
  }

  function charPreview(npc){
    if (!hasChar(npc)) return "";
    const frames = usableFrames(npc);
    if (!frames.length) return "";

    const many = frames.length > 1;
    return `<div class="charwrap">
      <div class="charbox"><div class="charstage" id="charstage"></div></div>
      <div class="charctl">
        ${many ? `<button type="button" id="charplay">Tạm dừng</button>
        <input type="range" id="charframe" min="0" max="${frames.length - 1}" value="0" aria-label="Khung hình">` : ""}
        <span class="lbl" id="charlbl">${many
          ? `khung 1 / ${frames.length}`
          : "chỉ có 1 tư thế — NPC này đứng yên"}</span>
      </div>
    </div>`;
  }

  const BOX_W = 160, BOX_H = 180, MAX_ZOOM = 2;

  /** Dat san khau vua dung hop bao, roi phong to het co ma van lot khung xem.
   *
   * Boss to gap nhieu lan quai thuong (co con sheet 852x834), khung co dinh
   * 80x90 se cat mat hoac day han ra ngoai - nen ti le phai tinh theo tung con.
   */
  function fitStage(stage, box){
    const w = Math.max(1, box.maxX - box.minX);
    const h = Math.max(1, box.maxY - box.minY);
    const scale = Math.min(MAX_ZOOM, BOX_W / w, BOX_H / h);
    stage.style.width = w + "px";
    stage.style.height = h + "px";
    stage.style.transform = `scale(${scale.toFixed(3)})`;
    return { w, h, scale };
  }

  /** Toa do tung manh cua mot khung hinh, theo dung cong thuc trong Char.paint. */
  function charLayers(npc, cf){
    const info = D.charInfo[cf];
    const out = [];

    for (const slot of PART_SLOT){
      const part = partOf(npc, slot.key);
      if (!part) continue;
      const [pi, ox, oy] = info[slot.k];
      const fr = part.frames[pi];
      if (!fr || fr[0] <= 0) continue;
      const c = COORDS[fr[0]];
      if (!c) continue;

      const [ax, ay, w, h] = c;
      // Char.paint: x = cx + (CharInfo.dx + pi.dx), y = cy - CharInfo.dy + pi.dy.
      // Neo TOP|RIGHT (24) nen goc trai = x - chieu rong anh.
      out.push({ ax, ay, w, h, x: ox + fr[1] - w, y: -oy + fr[2] });
    }
    return out;
  }

  /** Ghep mot khung hinh, canh cho nhan vat nam gon giua khung xem. */
  function charFrameHtml(npc, cf, box){
    const layers = charLayers(npc, cf);
    if (!layers.length) return "";

    // Toa do tinh theo goc tren-trai cua hop bao chung CA doan hoat anh,
    // nho vay nhan vat dung yen mot cho thay vi nhay giua cac khung.
    const dx = -box.minX, dy = -box.minY;

    return layers.map(l =>
      `<i class="sp" style="position:absolute;left:${l.x + dx}px;top:${l.y + dy}px;` +
      `width:${l.w}px;height:${l.h}px;background-position:${-l.ax}px ${-l.ay}px"></i>`).join("");
  }

  /** Hop bao chung cua moi khung, dung de canh vi tri co dinh. */
  function charBox(npc, frames){
    const boxes = [];
    for (const cf of frames){
      const b = frameBox(charLayers(npc, cf));
      if (b) boxes.push(b);
    }
    return typicalBox(boxes);
  }

  let animTimer = null;

  function stopAnim(){
    if (animTimer){ clearInterval(animTimer); animTimer = null; }
  }

  /** Chay vong hoat anh qua `count` khung, dung chung cho ca nhan vat lan quai. */
  function runAnim(count, drawAt){
    const slider = document.getElementById("charframe");
    const label = document.getElementById("charlbl");
    const play = document.getElementById("charplay");
    let i = 0, running = true;

    function draw(){
      drawAt(i);
      if (slider) slider.value = String(i);
      if (label && count > 1) label.textContent = `khung ${i + 1} / ${count}`;
    }

    // chi mot khung thi ve mot lan roi thoi, khong can dong ho
    if (count === 1){ draw(); return; }

    function tick(){
      stopAnim();
      animTimer = setInterval(() => { i = (i + 1) % count; draw(); }, 140);
    }

    if (slider) slider.addEventListener("input", () => {
      i = Number(slider.value);
      running = false;
      if (play) play.textContent = "Chạy";
      stopAnim();
      draw();
    });

    if (play) play.addEventListener("click", () => {
      running = !running;
      play.textContent = running ? "Tạm dừng" : "Chạy";
      if (running) tick(); else stopAnim();
    });

    draw();
    tick();
  }

  function startCharAnim(npc){
    stopAnim();
    const stage = document.getElementById("charstage");
    if (!stage) return;

    const frames = usableFrames(npc);
    if (!frames.length) return;

    const box = charBox(npc, frames);
    fitStage(stage, box);
    runAnim(frames.length, i => stage.innerHTML = charFrameHtml(npc, frames[i], box));
  }

  // ---------- preview hoat anh quai ----------
  // Quai khong ghep tu ba manh nhu nhan vat. Moi con co mot sprite sheet rieng
  // kem bang manh anh (x0,y0,w,h) va danh sach khung; moi khung la mot chum
  // mieng ghep lai. Doc y het EffectData.paintFrame cua client.

  function mobSprite(mob){
    return D.mobSprites ? D.mobSprites[mob.id] : null;
  }

  function mobLayers(sp, f){
    const out = [];
    const [ax, ay] = sp.sheet;
    for (const [dx, dy, idImg] of sp.frames[f] || []){
      const info = sp.infos[idImg];
      if (!info) continue;
      const [x0, y0, w, h] = info;
      // paintFrame: cat vung (x0,y0,w,h) roi dat tai (x+dx, y+dy), neo TOP|LEFT
      out.push({ ax: ax + x0, ay: ay + y0, w, h, x: dx, y: dy });
    }
    return out;
  }

  /** Thu tu phat that su: bang seq neu co, khong thi lan luot tung khung.
   *
   * Khong dung seq thi hoat anh vua loan vua nhay, vi danh sach khung con chua
   * ca tu the danh va chet - nhung khung khong nam trong chu ky di.
   */
  function mobPlaylist(sp){
    return (sp.seq && sp.seq.length) ? sp.seq : sp.frames.map((_, i) => i);
  }

  /** Hop bao cua nhung khung CO KICH THUOC DIEN HINH.
   *
   * Gop het moi khung thi hong: boss co khung danh rong toi 366px trong khi
   * tu the thuong chi ~93px, lay ca vao thi ti le bi keo xuong 0.3 va con quai
   * nho ti hon. Bo cac khung to bat thuong ra, chung se tran ra ngoai va bi cat -
   * doi lai tu the thuong hien dung co.
   */
  function typicalBox(boxes){
    if (!boxes.length) return { minX: 0, maxX: 1, minY: 0, maxY: 1 };

    // Lay khung o phan vi 35% dien tich lam chuan, roi noi rong 25%.
    // Gop het moi khung thi hong: boss co khung lao toi trai rong toi 500px
    // trong khi tu the dung chi ~93px, lay ca vao thi con quai nho ti hon.
    // Khung to bat thuong se tran ra ngoai va bi cat - dung y muon.
    const sorted = boxes.slice().sort((a, b) =>
      (a.maxX - a.minX) * (a.maxY - a.minY) - (b.maxX - b.minX) * (b.maxY - b.minY));
    const ref = sorted[Math.floor(sorted.length * 0.35)] || sorted[0];

    const padX = (ref.maxX - ref.minX) * 0.125;
    const padY = (ref.maxY - ref.minY) * 0.125;
    return {
      minX: ref.minX - padX, maxX: ref.maxX + padX,
      minY: ref.minY - padY, maxY: ref.maxY + padY,
    };
  }

  function frameBox(layers){
    if (!layers.length) return null;
    return {
      minX: Math.min(...layers.map(l => l.x)), maxX: Math.max(...layers.map(l => l.x + l.w)),
      minY: Math.min(...layers.map(l => l.y)), maxY: Math.max(...layers.map(l => l.y + l.h)),
    };
  }

  function mobBox(sp){
    const boxes = [];
    for (const f of new Set(mobPlaylist(sp))){
      const b = frameBox(mobLayers(sp, f));
      if (b) boxes.push(b);
    }
    return typicalBox(boxes);
  }

  function mobFrameHtml(sp, f, box){
    const dx = -box.minX, dy = -box.minY;
    return mobLayers(sp, f).map(l =>
      `<i class="msp" style="position:absolute;left:${l.x + dx}px;top:${l.y + dy}px;` +
      `width:${l.w}px;height:${l.h}px;background-position:${-l.ax}px ${-l.ay}px"></i>`).join("");
  }

  function mobPreview(mob){
    const sp = mobSprite(mob);
    if (!sp || !sp.frames.length) return "";
    const list = mobPlaylist(sp);
    const many = list.length > 1;
    return `<div class="charwrap">
      <div class="charbox"><div class="charstage" id="charstage"></div></div>
      <div class="charctl">
        ${many ? `<button type="button" id="charplay">Tạm dừng</button>
        <input type="range" id="charframe" min="0" max="${list.length - 1}" value="0" aria-label="Khung hình">` : ""}
        <span class="lbl" id="charlbl">${many
          ? `khung 1 / ${list.length}${sp.seq && sp.seq.length ? " (theo bảng thứ tự)" : ""}`
          : "chỉ có 1 khung"}</span>
      </div>
    </div>`;
  }

  function startMobAnim(mob){
    stopAnim();
    const sp = mobSprite(mob);
    const stage = document.getElementById("charstage");
    if (!sp || !stage || !sp.frames.length) return;
    const box = mobBox(sp);
    fitStage(stage, box);
    const list = mobPlaylist(sp);
    runAnim(list.length, i => stage.innerHTML = mobFrameHtml(sp, list[i], box));
  }

  /** Bang quai trong mot ban do.
   *
   * Gom theo (mau quai, cap, HP) chu khong chi theo mau: cung mot loai quai
   * co the duoc dat nhieu cum voi cap va HP khac nhau. HP o day la HP ghi trong
   * du lieu map, co the khac HP goc trong mob_template.
   */
  function mobTable(list){
    const groups = new Map();
    list.forEach(m => {
      const key = m.t + "|" + m.lv + "|" + m.hp;
      const g = groups.get(key) || { t: m.t, lv: m.lv, hp: m.hp, n: 0 };
      g.n++;
      groups.set(key, g);
    });

    const rows = [...groups.values()]
      .sort((a, b) => b.n - a.n || a.t - b.t)
      .map(g => {
        const t = mobById[g.t];
        const diff = t && t.hp !== g.hp;
        return `<tr>
          <td><span class="id">${g.t}</span></td>
          <td>${esc(t ? t.name : "không có trong mob_template")}</td>
          <td class="n">${g.n}</td>
          <td class="n">${g.lv}</td>
          <td class="n">${num(g.hp)}${diff ? ` <span class="was">gốc ${num(t.hp)}</span>` : ""}</td>
          <td class="n">${t ? t.speed : "—"}</td>
          <td class="n">${t ? t.rangeMove : "—"}</td>
          <td class="n">${t ? t.pctTiemNang : "—"}</td>
        </tr>`;
      }).join("");

    return `<h3>Quái trong bản đồ (${list.length} con)</h3>
      <div class="tablewrap"><table>
        <thead><tr>
          <th>id</th><th>Tên</th><th class="n">Số con</th><th class="n">Cấp</th>
          <th class="n">HP</th><th class="n">Tốc độ</th><th class="n">Tầm đi</th><th class="n">% TN</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  /** Bang npc_template cho cac NPC dung trong mot ban do, du cot nhu bang goc. */
  function npcTable(ids){
    const rows = ids.map(id => {
      const n = npcById[id];
      return `<tr>
        <td>${icon(n ? n.icon : -1, 24, "sm")}</td>
        <td><span class="id">${id}</span></td>
        <td>${esc(n ? n.name : "không có trong npc_template")}</td>
        <td class="n">${n ? n.head : "—"}</td>
        <td class="n">${n ? n.body : "—"}</td>
        <td class="n">${n ? n.leg : "—"}</td>
        <td class="n">${n && n.icon >= 0 ? n.icon : "—"}</td>
      </tr>`;
    }).join("");

    return `<h3>NPC trong bản đồ (${ids.length})</h3>
      <div class="tablewrap"><table>
        <thead><tr>
          <th></th><th>id</th><th>Tên</th>
          <th class="n">head</th><th class="n">body</th><th class="n">leg</th><th class="n">avatar</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  // ---------- nap du lieu ----------
  // Ban gop mot file nhung san du lieu vao the script; ban tren web thi tai roi.
  const inlineData = document.getElementById("inline-data");
  const source = inlineData
    ? Promise.resolve([JSON.parse(inlineData.textContent),
                       JSON.parse(document.getElementById("inline-icons").textContent)])
    : Promise.all([
        fetch("assets/data.json?v=__BUILD__").then(r => r.json()),
        fetch("assets/icons.json?v=__BUILD__").then(r => r.json()),
      ]);

  source.then(([data, coords]) => {
    D = data;
    COORDS = coords;

    D.mobs.forEach(m => { mobName[m.id] = m.name; mobById[m.id] = m; });
    D.npcs.forEach(n => { npcName[n.id] = n.name; npcById[n.id] = n; });
    D.maps.forEach(m => mapName[m.id] = m.name);

    Object.keys(VIEWS).forEach(k => {
      VIEWS[k].rows().forEach(r => { r._s = VIEWS[k].text(r); });
    });

    el.tabs.innerHTML = Object.entries(VIEWS).map(([k, v]) =>
      `<button class="tab" type="button" role="tab" data-view="${k}" aria-selected="${k === view}">
         ${esc(v.label)} <span class="n">${num(v.rows().length)}</span>
       </button>`).join("");

    switchView("items");
  }).catch(err => {
    el.count.textContent = "lỗi tải dữ liệu";
    el.body.innerHTML = `<div class="empty-state">Không tải được dữ liệu: ${esc(err.message)}</div>`;
  });

  // ---------- doi bang ----------
  el.tabs.addEventListener("click", e => {
    const b = e.target.closest(".tab");
    if (b) switchView(b.dataset.view);
  });

  function switchView(key){
    view = key;
    selected = null;
    chipState.clear();
    el.q.value = "";
    el.detail.dataset.open = "false";

    el.tabs.querySelectorAll(".tab").forEach(t =>
      t.setAttribute("aria-selected", String(t.dataset.view === key)));

    const V = VIEWS[key];

    const f = V.filter ? V.filter() : null;
    el.filter.hidden = !f;
    if (f) el.filter.innerHTML = `<option value="">${esc(f.label)}</option>` +
      f.options.map(o => `<option value="${o.v}">${esc(o.label)}</option>`).join("");

    el.sort.innerHTML = V.sorts.map(s => `<option value="${s.v}">${esc(s.label)}</option>`).join("");

    const chips = V.chips ? V.chips() : [];
    el.chips.innerHTML = chips.map(c =>
      `<button class="chip" type="button" data-v="${c.v}" data-key="${c.key}" aria-pressed="false">${esc(c.label)}</button>`).join("");

    render(true);
  }

  el.chips.addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    const v = Number(b.dataset.v);
    if (chipState.has(v)) { chipState.delete(v); b.setAttribute("aria-pressed", "false"); }
    else { chipState.add(v); b.setAttribute("aria-pressed", "true"); }
    render(true);
  });

  // ---------- loc, sap xep, ve ----------
  function applyFilter(){
    const V = VIEWS[view];
    const terms = fold(el.q.value).split(/\s+/).filter(Boolean);
    const f = V.filter ? V.filter() : null;
    const fv = el.filter.value === "" ? null : Number(el.filter.value);
    const chipKey = V.chips ? V.chips()[0].key : null;

    filtered = V.rows().filter(r => {
      if (f && fv !== null && r[f.key] !== fv) return false;
      if (chipKey && chipState.size && !chipState.has(r[chipKey])) return false;
      for (const t of terms) if (r._s.indexOf(t) === -1) return false;
      return true;
    });

    const s = V.sorts.find(x => x.v === el.sort.value) || V.sorts[0];
    filtered.sort(s.cmp);
  }

  const pageCount = () => Math.max(1, Math.ceil(filtered.length / perPage));

  function render(resetPage){
    if (!D) return;
    if (resetPage) page = 1;
    applyFilter();

    const pages = pageCount();
    if (page > pages) page = pages;

    const V = VIEWS[view];
    const start = (page - 1) * perPage;
    const slice = filtered.slice(start, start + perPage);

    el.body.innerHTML = V.mode === "table" ? tableHtml(V, slice) : `<div class="grid">${slice.map(V.card).join("")}</div>`;
    el.empty.hidden = filtered.length > 0;
    el.count.innerHTML = filtered.length
      ? `<b>${num(start + 1)}–${num(start + slice.length)}</b> / ${num(filtered.length)}`
      : `<b>0</b> / ${num(V.rows().length)}`;

    renderPager(pages);
  }

  function tableHtml(V, rows){
    return `<div class="tablewrap"><table>
      <thead><tr>${V.cols.map(c => `<th class="${c.n ? "n" : ""}">${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr data-id="${r.id}" aria-selected="${selected === r.id}">
        ${V.cols.map(c => `<td class="${c.n ? "n" : ""}">${c.get(r)}</td>`).join("")}
      </tr>`).join("")}</tbody>
    </table></div>`;
  }

  function pageWindow(pages){
    const near = new Set([1, pages, page]);
    for (let d = 1; d <= 2; d++){
      if (page - d >= 1) near.add(page - d);
      if (page + d <= pages) near.add(page + d);
    }
    const out = [];
    let prev = 0;
    for (const p of [...near].sort((a, b) => a - b)){
      if (prev && p - prev > 1) out.push("gap");
      out.push(p);
      prev = p;
    }
    return out;
  }

  function renderPager(pages){
    if (pages <= 1){ el.pager.innerHTML = ""; return; }
    const parts = [`<button class="step" type="button" data-page="${page - 1}" ${page === 1 ? "disabled" : ""}>Trước</button>`];
    for (const p of pageWindow(pages)){
      parts.push(p === "gap" ? `<span class="gap">…</span>`
        : `<button type="button" data-page="${p}" ${p === page ? 'aria-current="page"' : ""}>${p}</button>`);
    }
    parts.push(`<button class="step" type="button" data-page="${page + 1}" ${page === pages ? "disabled" : ""}>Sau</button>`);
    parts.push(`<span class="total">trang ${num(page)} / ${num(pages)}</span>`);
    el.pager.innerHTML = parts.join("");
  }

  function goTo(p){
    const next = Math.min(pageCount(), Math.max(1, p));
    if (next === page) return;
    page = next;
    render();
    window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  el.pager.addEventListener("click", e => {
    const b = e.target.closest("button[data-page]");
    if (b) goTo(Number(b.dataset.page));
  });

  el.perpage.addEventListener("change", () => {
    perPage = Number(el.perpage.value) || 60;
    render(true);
  });

  // ---------- chon dong ----------
  el.body.addEventListener("click", e => {
    const hit = e.target.closest("[data-id]");
    if (!hit) return;
    const id = Number(hit.dataset.id);
    const r = filtered.find(x => x.id === id);
    if (!r) return;

    selected = id;
    el.body.querySelectorAll('[aria-selected="true"]').forEach(n => n.setAttribute("aria-selected", "false"));
    hit.setAttribute("aria-selected", "true");

    stopAnim();
    el.detailBody.innerHTML = VIEWS[view].detail(r) +
      `<button class="copy" type="button" data-copy="${id}">Chép id ${id}</button>`;
    el.detail.dataset.open = "true";
    if (view === "npcs") startCharAnim(r);
    if (view === "mobs") startMobAnim(r);
    copy(id);
  });

  el.detailBody.addEventListener("click", e => {
    const jump = e.target.closest("[data-jump-type]");
    if (jump){
      switchView("items");
      el.filter.value = jump.dataset.jumpType;
      render(true);
      return;
    }
    const b = e.target.closest("[data-copy]");
    if (b) copy(Number(b.dataset.copy));
  });
  document.getElementById("close").addEventListener("click", () => {
    el.detail.dataset.open = "false";
    stopAnim();
  });

  // ---------- chep id ----------
  let toastTimer;
  function copy(id){
    const done = () => flash(`Đã chép id ${id}`);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(String(id)).then(done, () => fallback(id, done));
    } else fallback(id, done);
  }

  function fallback(id, done){
    const ta = document.createElement("textarea");
    ta.value = String(id);
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (_) { flash(`id ${id}`); }
    document.body.removeChild(ta);
  }

  function flash(msg){
    el.toast.textContent = msg;
    el.toast.dataset.show = "true";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.toast.dataset.show = "false"; }, 1400);
  }

  // ---------- ban phim ----------
  let debounce;
  el.q.addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => render(true), 110);
  });
  el.filter.addEventListener("change", () => render(true));
  el.sort.addEventListener("change", () => render(true));

  document.addEventListener("keydown", e => {
    const typing = document.activeElement === el.q;
    if (e.key === "/" && !typing) { e.preventDefault(); el.q.focus(); el.q.select(); }
    else if (e.key === "Escape") {
      if (el.detail.dataset.open === "true") el.detail.dataset.open = "false";
      else if (typing) { el.q.value = ""; render(true); }
    } else if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
      if (e.key === "ArrowLeft") { e.preventDefault(); goTo(page - 1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); goTo(page + 1); }
    }
  });
})();
</script>
</body>
</html>
